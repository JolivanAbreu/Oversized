openapi: 3.0.3
info:
  title: Dravennx API
  version: "2.0.0"
  description: >
    API REST do sistema Dravennx (loja + painel administrativo).
    Versão 2.0 — revisão fiel ao sistema em produção (agosto de 2026),
    substitui a v1.0 de planejamento. Base URL definida por variável de
    ambiente em cada ambiente (dev/staging/produção); não há domínio fixo.
servers:
  - url: http://localhost:3000/v1
    description: Ambiente de desenvolvimento local
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: bad_request
        message:
          type: string
          example: Descrição legível do erro
tags:
  - name: Loja pública
    description: Informações públicas da loja (WhatsApp, banner, Instagram)
  - name: Autenticação e conta
  - name: Catálogo, avaliações e favoritos
  - name: Carrinho, cupom, endereço e pedido
  - name: Pagamento
  - name: Admin - usuários
  - name: Admin - produtos e categorias
  - name: Admin - pedidos e cupons
  - name: Admin - vitrine da home
  - name: Admin - relatórios e dashboard

paths:
  /health:
    get:
      tags: [Loja pública]
      summary: Healthcheck do servidor
      security: []
      responses:
        "200": { description: OK }

  /store-info:
    get:
      tags: [Loja pública]
      summary: Nome da loja e número de WhatsApp configurado
      security: []
      responses:
        "200": { description: OK }

  /promo-banner:
    get:
      tags: [Loja pública]
      summary: Conteúdo atual do banner promocional da home
      security: []
      responses:
        "200": { description: OK }

  /instagram-posts:
    get:
      tags: [Loja pública]
      summary: Posts ativos da galeria curada do Instagram
      security: []
      responses:
        "200": { description: OK }

  /register:
    post:
      tags: [Autenticação e conta]
      summary: Cadastra novo cliente
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, cpf]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 8 }
                cpf: { type: string }
                phone: { type: string }
      responses:
        "201": { description: Criado }
        "400": { description: Dados inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /confirm-email:
    post:
      tags: [Autenticação e conta]
      summary: Confirma e-mail a partir do token recebido
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { token: { type: string } } }
      responses:
        "200": { description: OK }

  /login:
    post:
      tags: [Autenticação e conta]
      summary: Autentica e retorna access/refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: OK }
        "401": { description: Credenciais inválidas }

  /refresh:
    post:
      tags: [Autenticação e conta]
      summary: Renova o access_token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { refresh_token: { type: string } } }
      responses:
        "200": { description: OK }

  /forgot-password:
    post:
      tags: [Autenticação e conta]
      summary: Envia e-mail de redefinição de senha
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { email: { type: string } } }
      responses:
        "200": { description: OK }

  /reset-password:
    post:
      tags: [Autenticação e conta]
      summary: Redefine senha a partir do token recebido por e-mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { token: { type: string }, password: { type: string, minLength: 8 } }
      responses:
        "200": { description: OK }

  /account:
    get:
      tags: [Autenticação e conta]
      summary: Dados do perfil do usuário logado
      responses:
        "200": { description: OK }
    put:
      tags: [Autenticação e conta]
      summary: Atualiza nome/telefone
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string }, phone: { type: string } } }
      responses:
        "200": { description: OK }

  /account/email:
    put:
      tags: [Autenticação e conta]
      summary: Troca de e-mail (exige senha atual)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { new_email: { type: string }, current_password: { type: string } }
      responses:
        "200": { description: OK }

  /account/password:
    put:
      tags: [Autenticação e conta]
      summary: Troca de senha (exige senha atual)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { current_password: { type: string }, new_password: { type: string, minLength: 8 } }
      responses:
        "200": { description: OK }

  /products:
    get:
      tags: [Catálogo, avaliações e favoritos]
      summary: Lista produtos
      security: []
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: size, in: query, schema: { type: string } }
        - { name: color, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: sort, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK }

  /products/featured:
    get:
      tags: [Catálogo, avaliações e favoritos]
      summary: Produtos em destaque (banner ou destaque)
      security: []
      parameters:
        - { name: slot, in: query, required: true, schema: { type: string, enum: [banner, destaque] } }
      responses:
        "200": { description: OK }

  /products/search:
    get:
      tags: [Catálogo, avaliações e favoritos]
      summary: Busca textual de produtos
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }

  /products/{slug}:
    get:
      tags: [Catálogo, avaliações e favoritos]
      summary: Detalhe de um produto
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
        "404": { description: Não encontrado }

  /categories:
    get:
      tags: [Catálogo, avaliações e favoritos]
      summary: Lista de categorias
      security: []
      responses:
        "200": { description: OK }

  /products/{id}/reviews:
    get:
      tags: [Catálogo, avaliações e favoritos]
      summary: Avaliações de um produto
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
    post:
      tags: [Catálogo, avaliações e favoritos]
      summary: Cria avaliação (exige pedido entregue com o produto)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { rating: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string } }
      responses:
        "201": { description: Criado }
        "403": { description: Pedido não entregue, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /wishlist:
    get:
      tags: [Catálogo, avaliações e favoritos]
      summary: Lista de favoritos do cliente
      responses:
        "200": { description: OK }
    post:
      tags: [Catálogo, avaliações e favoritos]
      summary: Adiciona produto aos favoritos
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { product_id: { type: string, format: uuid } } }
      responses:
        "201": { description: Criado }

  /wishlist/{productId}:
    delete:
      tags: [Catálogo, avaliações e favoritos]
      summary: Remove produto dos favoritos
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Sem conteúdo }

  /cart:
    get:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Carrinho atual com itens e subtotal
      responses:
        "200": { description: OK }

  /cart/items:
    post:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Adiciona item ao carrinho
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { variant_id: { type: string, format: uuid }, quantity: { type: integer, minimum: 1 } }
      responses:
        "201": { description: Criado }
        "409": { description: Estoque insuficiente, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /cart/items/{id}:
    put:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Altera quantidade de um item
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { quantity: { type: integer, minimum: 1 } } }
      responses:
        "200": { description: OK }
    delete:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Remove item do carrinho
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Sem conteúdo }

  /cart/shipping-quote:
    post:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Retorna as opções de frete (Uber Flash, 99, combinar)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { zip: { type: string } } }
      responses:
        "200": { description: OK }

  /coupons/validate:
    post:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Valida um cupom e retorna o desconto
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { code: { type: string } } }
      responses:
        "200": { description: OK }
        "404": { description: Cupom inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /addresses:
    get:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Endereços do cliente
      responses:
        "200": { description: OK }
    post:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Cadastra endereço
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [street, number, neighborhood, city, state, zip]
              properties:
                label: { type: string }
                street: { type: string }
                number: { type: string }
                complement: { type: string }
                neighborhood: { type: string }
                city: { type: string }
                state: { type: string }
                zip: { type: string }
                isDefault: { type: boolean }
      responses:
        "201": { description: Criado }

  /addresses/{id}:
    put:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Atualiza endereço
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
    delete:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Remove endereço
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Sem conteúdo }

  /orders:
    post:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Cria pedido a partir do carrinho
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [address_id, shipping_option_id]
              properties:
                address_id: { type: string, format: uuid }
                shipping_option_id: { type: string, enum: [uberflex, 99flex, combinar] }
                coupon_code: { type: string }
      responses:
        "201": { description: Criado }
    get:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Pedidos do cliente logado
      responses:
        "200": { description: OK }

  /orders/{id}:
    get:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Detalhe de um pedido
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
    delete:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Exclui pedido do histórico (só quando não pago ou já cancelado)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Sem conteúdo }

  /orders/{id}/cancel:
    post:
      tags: [Carrinho, cupom, endereço e pedido]
      summary: Cancela pedido próprio (dentro das transições permitidas)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }

  /payments/card:
    post:
      tags: [Pagamento]
      summary: Paga com cartão
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [order_id, card_token, installments]
              properties:
                order_id: { type: string, format: uuid }
                card_token: { type: string }
                installments: { type: integer }
      responses:
        "201": { description: Criado }
        "502": { description: Provedor de pagamento indisponível, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /payments/pix:
    post:
      tags: [Pagamento]
      summary: Gera cobrança Pix (QR Code + copia-e-cola)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { order_id: { type: string, format: uuid } } }
      responses:
        "201": { description: Criado }
        "502": { description: Provedor de pagamento indisponível, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /payments/{id}/status:
    get:
      tags: [Pagamento]
      summary: Consulta status de uma transação
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }

  /webhooks/mercadopago:
    post:
      tags: [Pagamento]
      summary: Recebido do Mercado Pago para confirmar pagamentos (validado por assinatura HMAC, sem JWT)
      security: []
      responses:
        "200": { description: OK }
        "401": { description: Assinatura inválida }

  /admin/users:
    get:
      tags: [Admin - usuários]
      summary: Lista usuários (admin)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK }

  /admin/users/{id}/role:
    put:
      tags: [Admin - usuários]
      summary: Altera o perfil de um usuário (não pode alterar o próprio)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { role: { type: string, enum: [customer, operator, admin] } } }
      responses:
        "200": { description: OK }
        "400": { description: Tentativa de alterar o próprio perfil, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/users/{id}/reset-password:
    post:
      tags: [Admin - usuários]
      summary: Gera senha temporária para o usuário
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }

  /admin/products:
    get:
      tags: [Admin - produtos e categorias]
      summary: Lista produtos (admin/operador)
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK }
    post:
      tags: [Admin - produtos e categorias]
      summary: Cria produto
      responses:
        "201": { description: Criado }

  /admin/products/{id}:
    get:
      tags: [Admin - produtos e categorias]
      summary: Detalhe completo de um produto
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
    put:
      tags: [Admin - produtos e categorias]
      summary: Atualiza produto
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
    delete:
      tags: [Admin - produtos e categorias]
      summary: Desativa produto (exclusão lógica)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Sem conteúdo }

  /admin/products/{id}/reactivate:
    put:
      tags: [Admin - produtos e categorias]
      summary: Reativa produto desativado
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }

  /admin/variants/{variantId}/stock:
    put:
      tags: [Admin - produtos e categorias]
      summary: Ajusta estoque de uma variação
      parameters: [{ name: variantId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { delta: { type: integer }, reason: { type: string } } }
      responses:
        "200": { description: OK }

  /admin/uploads:
    post:
      tags: [Admin - produtos e categorias]
      summary: Upload de imagem (multipart/form-data) — retorna URL pública
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { image: { type: string, format: binary } } }
      responses:
        "201": { description: Criado }

  /admin/categories:
    get:
      tags: [Admin - produtos e categorias]
      summary: Lista categorias com contagem de produtos
      responses:
        "200": { description: OK }
    post:
      tags: [Admin - produtos e categorias]
      summary: Cria categoria
      responses:
        "201": { description: Criado }

  /admin/categories/{id}:
    put:
      tags: [Admin - produtos e categorias]
      summary: Atualiza categoria
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
    delete:
      tags: [Admin - produtos e categorias]
      summary: Exclui categoria (bloqueado se tiver produtos vinculados)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Sem conteúdo }
        "409": { description: Categoria tem produtos vinculados, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/orders:
    get:
      tags: [Admin - pedidos e cupons]
      summary: Lista pedidos (admin/operador)
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string }, description: "Número do pedido ou nome/e-mail do cliente" }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        "200": { description: OK }

  /admin/orders/{id}:
    get:
      tags: [Admin - pedidos e cupons]
      summary: Detalhe de qualquer pedido
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }

  /admin/orders/{id}/status:
    put:
      tags: [Admin - pedidos e cupons]
      summary: Atualiza status do pedido (transições mais amplas que as do cliente)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { status: { type: string }, trackingCode: { type: string } } }
      responses:
        "200": { description: OK }

  /admin/coupons:
    get:
      tags: [Admin - pedidos e cupons]
      summary: Lista cupons
      responses:
        "200": { description: OK }
    post:
      tags: [Admin - pedidos e cupons]
      summary: Cria cupom
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code, discountType, discountValue, validFrom, validUntil]
              properties:
                code: { type: string }
                discountType: { type: string, enum: [percentage, fixed] }
                discountValue: { type: number }
                minOrderValue: { type: number }
                validFrom: { type: string, format: date }
                validUntil: { type: string, format: date }
                usageLimit: { type: integer }
      responses:
        "201": { description: Criado }

  /admin/coupons/{id}:
    put:
      tags: [Admin - pedidos e cupons]
      summary: Edita cupom
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
    delete:
      tags: [Admin - pedidos e cupons]
      summary: Exclui cupom
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Sem conteúdo }

  /admin/coupons/{id}/active:
    put:
      tags: [Admin - pedidos e cupons]
      summary: Ativa/desativa cupom
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { active: { type: boolean } } }
      responses:
        "200": { description: OK }

  /admin/promo-banner:
    get:
      tags: [Admin - vitrine da home]
      summary: Configuração atual do banner promocional
      responses:
        "200": { description: OK }
    put:
      tags: [Admin - vitrine da home]
      summary: Atualiza banner (texto, imagem, enquadramento)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eyebrow: { type: string }
                title: { type: string }
                subtitle: { type: string }
                description: { type: string }
                imageUrl: { type: string }
                imageFocalPoint: { type: string, enum: [top, center, bottom] }
      responses:
        "200": { description: OK }

  /admin/instagram-posts:
    get:
      tags: [Admin - vitrine da home]
      summary: Lista todos os posts (ativos e inativos)
      responses:
        "200": { description: OK }
    post:
      tags: [Admin - vitrine da home]
      summary: Adiciona post à galeria
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [imageUrl, postUrl]
              properties:
                imageUrl: { type: string }
